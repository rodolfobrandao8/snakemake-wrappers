name: recognizer
description: A tool for domain based annotation with the COG database, providing functional classification of proteins.
url: https://github.com/iquasere/reCOGnizer
authors:
  - Rodolfo Brandão Dias Ferreira
  - Artur Rafael de Oliveira Gomes
input:
  - fasta: FASTA file containing protein sequences (amino acids).
output:
  - tsv: Main tabular results file with COG annotations (e.g., recognizer_results.tsv).
  - html: (Optional) Interactive HTML report generated by reCOGnizer.
  - xlsx: (Optional) Excel spreadsheet summary of the annotations.
params:
  - extra: Additional arguments to pass to reCOGnizer (e.g., --evalue, --custom_database, --resources_directory, --max_target_seqs).