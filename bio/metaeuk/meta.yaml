name: metaeuk easy-predict
description: High-throughput gene discovery and annotation for eukaryotic metagenomics.
authors:
  - Rodolfo Brandão Dias Ferreira
  - Artur Rafael de Oliveira Gomes
input:
  - contigs: FASTA file containing genomic contigs
  - db: Protein reference database in FASTA format
output:
  - Various files with prefix defined in params (e.g., .gff, .fas, .codon.fas)
notes: |
  * MetaEuk requires a temporary directory (tmp_dir).
  * Output prefix is defined via params.out_prefix.
