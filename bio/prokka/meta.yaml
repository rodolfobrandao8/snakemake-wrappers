name: prokka
description: Rapid prokaryotic genome annotation.
authors:
  - Rodolfo Brandão Dias Ferreira
  - Artur Rafael de Oliveira Gomes
input:
  - fasta: FASTA file containing genomic contigs
output:
  - Various files including .gff, .gbk, .fna, and .faa
notes: |
  * Prokka requires a specific output directory via params.outdir.
  * Use params.extra to pass additional arguments (e.g., --kingdom, --genus).
